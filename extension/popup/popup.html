<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Video Controller</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="../icons/icon-32.png" alt="" width="20" height="20">
      <span>Video Controller</span>
    </div>
    <button id="openOptions" class="ghost" title="設定" aria-label="設定">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M11.3 1.5l.4 2.1c.5.2 1 .5 1.4.8l2-.7 1.3 2.3-1.6 1.4a6 6 0 010 1.6l1.6 1.4-1.3 2.3-2-.7c-.4.3-.9.6-1.4.8l-.4 2.1H8.7l-.4-2.1c-.5-.2-1-.5-1.4-.8l-2 .7L3.6 12.4l1.6-1.4a6 6 0 010-1.6L3.6 8l1.3-2.3 2 .7c.4-.3.9-.6 1.4-.8l.4-2.1h2.6zM10 7a3 3 0 100 6 3 3 0 000-6z"/></svg>
    </button>
  </header>

  <div id="status" class="status"></div>

  <main id="controls">
    <section>
      <div class="label"><span>播放速度</span><output id="rateVal">1×</output></div>
      <div class="row">
        <button class="step" data-act="slower" aria-label="減速">−</button>
        <input id="rate" type="range" min="0" max="1" step="0.001" aria-label="播放速度">
        <button class="step" data-act="faster" aria-label="加速">+</button>
      </div>
      <div class="ticks rate-ticks">
        <button data-rate="0.1">0.1×</button><button data-rate="1">1×</button><button data-rate="4">4×</button><button data-rate="16">16×</button>
      </div>
      <div id="rateChips" class="chips"></div>
    </section>

    <section class="vol">
      <div class="label"><span>音量</span><output id="volVal">100%</output></div>
      <div class="row">
        <button class="step" data-act="volDown" aria-label="音量減少">−</button>
        <input id="volume" type="range" min="0" max="400" step="5" aria-label="音量">
        <button class="step" data-act="volUp" aria-label="音量增加">+</button>
      </div>
      <div class="ticks vol-ticks">
        <button data-volume="0">0%</button><button data-volume="100">100%</button><button data-volume="200">200%</button><button data-volume="300">300%</button><button data-volume="400">400%</button>
      </div>
    </section>

    <section class="mono-row">
      <div>
        <div class="title">立體聲轉單聲道</div>
        <div class="hint">左右聲道混合，兩邊喇叭／耳機聽到相同聲音</div>
      </div>
      <label class="switch"><input id="mono" type="checkbox"><span></span></label>
    </section>

    <div id="notice" class="notice" hidden></div>

    <footer>
      <button id="resetAll" class="secondary">全部重設</button>
      <span id="shortcutHint" class="kbd-hint"></span>
    </footer>
  </main>

  <main id="overlayOnly" hidden>
    <p>目前設定為「只使用影片浮動面板」。把滑鼠移到影片上即可看到控制面板。</p>
    <button id="useBoth" class="secondary">改成兩者都使用</button>
  </main>

  <script src="../shared/common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
